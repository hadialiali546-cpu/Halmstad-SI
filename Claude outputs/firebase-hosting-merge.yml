# Builds the app and deploys it to https://si-halmstad.web.app on every push to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SI_HALMSTAD }}
          channelId: live
          projectId: si-halmstad
